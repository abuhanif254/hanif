<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b19" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)" />
  <rect width="1200" height="630" fill="url(#grid4)" />

  <rect x="48" y="36" width="1104" height="84" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <rect x="48" y="36" width="6" height="84" rx="3" fill="#10b981" />
  <text x="76" y="68" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#34d399" letter-spacing="1.5">SYSTEMS ARCHITECTURE BLUEPRINT • CASE STUDY 04</text>
  <text x="76" y="100" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">High-Concurrency PostgreSQL 16 Performance &amp; Index Audit</text>
  <rect x="920" y="56" width="208" height="44" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
  <text x="1024" y="83" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">-68% CPU • 0 Deadlocks</text>

  <!-- Before vs After Comparison Boxes -->
  <rect x="56" y="165" width="520" height="260" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
  <text x="86" y="202" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#f87171">BEFORE AUDIT: BOTTLENECK PROFILE</text>
  <text x="86" y="236" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#ffffff">Seq Scan on transactions (cost=0..58914)</text>
  <text x="86" y="272" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1">• Execution Time: 4,210 ms (P99 Timeout Spikes)</text>
  <text x="86" y="302" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1">• Buffer Reads: 184,100 uncached heap pages</text>
  <text x="86" y="332" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1">• Primary DB CPU: 92% sustained saturation</text>
  <text x="86" y="362" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f87171">• Connection Pool Exhaustion &amp; Lock Contention</text>

  <rect x="624" y="165" width="520" height="260" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <text x="654" y="202" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#34d399">AFTER AUDIT: TUNED ARCHITECTURE</text>
  <text x="654" y="236" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#ffffff">Index Only Scan (idx_tx_account_date_part)</text>
  <text x="654" y="272" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1">• Execution Time: 4.8 ms (350x Query Speedup)</text>
  <text x="654" y="302" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1">• Buffer Hits: 99.4% I/O reduction via Partial Index</text>
  <text x="654" y="332" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1">• Primary DB CPU: 28% median utilization</text>
  <text x="654" y="362" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34d399">• PgBouncer Transaction Pooling • 0 Deadlocks</text>

  <rect x="48" y="470" width="1104" height="112" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="84" y="512" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">QUERY LATENCY</text>
  <text x="84" y="550" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#10b981">4.2s → 4.8ms</text>

  <text x="390" y="512" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">CPU UTILIZATION</text>
  <text x="390" y="550" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#38bdf8">92% → 28% (-68%)</text>

  <text x="690" y="512" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">ACTIVE ACCOUNTS</text>
  <text x="690" y="550" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#f8fafc">3.5M+ Zero Drops</text>

  <text x="970" y="512" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">ARCHITECT</text>
  <text x="970" y="550" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#e2e8f0">Abu Hanif</text>
</svg>

  <text x="446" y="375" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399" text-anchor="middle">p99 Decode: 0.4ms</text>

  <!-- Arrow 2 -->
  <line x1="559" y1="300" x2="615" y2="300" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5,4" />
  <polygon points="615,294 627,300 615,306" fill="#38bdf8" />


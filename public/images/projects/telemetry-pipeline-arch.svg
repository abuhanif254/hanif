  <rect x="627" y="185" width="235" height="230" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="744" y="220" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">STATE &amp; STORAGE</text>
  <text x="744" y="248" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Redis + TimescaleDB</text>
  <rect x="649" y="270" width="190" height="32" rx="5" fill="#1e293b" />
  <text x="744" y="291" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">Sharded Pub/Sub Cluster</text>
  <rect x="649" y="312" width="190" height="32" rx="5" fill="#1e293b" />
  <text x="744" y="333" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">Continuous Rollups</text>

  <text x="744" y="375" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399" text-anchor="middle">Hypertable Compression</text>

  <!-- Arrow 3 -->
  <line x1="862" y1="300" x2="918" y2="300" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5,4" />
  <polygon points="918,294 930,300 918,306" fill="#10b981" />

  <!-- Node 4: Next.js Edge Fan-Out -->
  <rect x="930" y="185" width="218" height="230" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <text x="1039" y="220" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">CLIENT DELIVERY</text>
  <text x="1039" y="248" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Next.js 16 Canvas UI</text>
  <rect x="952" y="270" width="174" height="32" rx="5" fill="#1e293b" />
  <text x="1039" y="291" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">45,000+ Active Clients</text>
  <rect x="952" y="312" width="174" height="32" rx="5" fill="#1e293b" />
  <text x="1039" y="333" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">60fps WebGL Depth</text>
  <rect x="952" y="354" width="174" height="32" rx="5" fill="#1e293b" />
  <text x="1039" y="375" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399" text-anchor="middle">99.995% Uptime SLA</text>

  <!-- Bottom Telemetry Metrics Strip -->
  <rect x="48" y="470" width="1104" height="112" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="84" y="512" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">PEAK THROUGHPUT</text>
  <text x="84" y="550" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#38bdf8">12,000,000 msg/s</text>

  <text x="390" y="512" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">BROWSER P99 LATENCY</text>
  <text x="390" y="550" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#10b981">21.4 ms Global</text>

  <text x="680" y="512" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">CONCURRENT SESSIONS</text>
  <text x="680" y="550" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#f8fafc">45,000+ WebSockets</text>

  <text x="970" y="512" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">ARCHITECT</text>
  <text x="970" y="550" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#e2e8f0">Abu Hanif</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b19" />
      <stop offset="100%" stop-color="#0b1528" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top Header Banner -->
  <rect x="48" y="36" width="1104" height="84" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <rect x="48" y="36" width="6" height="84" rx="3" fill="#2563eb" />
  <text x="76" y="68" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">SYSTEMS ARCHITECTURE BLUEPRINT • CASE STUDY 01</text>
  <text x="76" y="100" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">Real-Time Financial Telemetry &amp; Order-Book Streaming Engine</text>
  <rect x="920" y="56" width="208" height="44" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
  <text x="1024" y="83" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">12M Events/s • &lt;22ms P99</text>

  <!-- Pipeline Nodes -->
  <!-- Node 1: 14 Exchange Feeds -->
  <rect x="56" y="185" width="210" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="161" y="220" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">INGESTION TIER</text>
  <text x="161" y="248" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">14 Exchange Feeds</text>
  <rect x="78" y="270" width="166" height="32" rx="5" fill="#1e293b" />
  <text x="161" y="291" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">FIX 4.4 / Raw WSS</text>
  <rect x="78" y="312" width="166" height="32" rx="5" fill="#1e293b" />
  <text x="161" y="333" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">L2/L3 Order Books</text>
  <rect x="78" y="354" width="166" height="32" rx="5" fill="#1e293b" />
  <text x="161" y="375" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399" text-anchor="middle">Zero-Alloc Buffers</text>

  <!-- Arrow 1 -->
  <line x1="266" y1="300" x2="322" y2="300" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5,4" />
  <polygon points="322,294 334,300 322,306" fill="#38bdf8" />

  <!-- Node 2: Go Ingestion Workers -->
  <rect x="334" y="185" width="225" height="230" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="2" />
  <text x="446" y="220" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">STREAM NORMALIZER</text>
  <text x="446" y="248" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Go Worker Mesh</text>
  <rect x="356" y="270" width="180" height="32" rx="5" fill="#1e293b" />
  <text x="446" y="291" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">Lock-Free RingBuffer</text>
  <rect x="356" y="312" width="180" height="32" rx="5" fill="#1e293b" />
  <text x="446" y="333" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">Protobuf Framing</text>
